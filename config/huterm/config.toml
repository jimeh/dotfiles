#:schema https://github.com/jimeh/huterm/releases/latest/download/huterm.schema.json

[settings]
show_advanced = true

[font]
size = 12.0

[theme]
light = "catppuccin-frappe"
dark = "tokyo-night-moon"

[terminal]
macos_option_as_alt = "both"
scrollback_rows = 50000

[palette]
placement = "center"

[panes]
title_bar = "hover"
inactive_dim_background = 0.1

[quake.profiles.default]
animation = "fade"
fullscreen = true
display = "primary"

# Toggle the default quake window, even from another application.
[[global_keybinding]]
key = "ctrl-cmd-r"
command = "toggle_quake"

[[keybinding]]
key = "cmd-r"
command = "reload_config"

[[keybinding]]
key = "cmd-{"
command = "previous_tab"

[[keybinding]]
key = "cmd-}"
command = "next_tab"

[[keybinding]]
key = "ctrl-g"
command = "palette_back"
when = "palette_visible"

# Alt+I/J/K/L: move focus between panes
[[keybinding]]
key = "alt-i"
command = "focus_pane_up"
when = "Terminal && split"

[[keybinding]]
key = "alt-j"
command = "focus_pane_left"
when = "Terminal && split"

[[keybinding]]
key = "alt-k"
command = "focus_pane_down"
when = "Terminal && split"

[[keybinding]]
key = "alt-l"
command = "focus_pane_right"
when = "Terminal && split"

# Ctrl+Alt+I/J/K/L: swap the focused pane with its neighbour
[[keybinding]]
key = "alt-shift-i"
command = "swap_pane_up"
when = "Terminal && split"

[[keybinding]]
key = "alt-shift-j"
command = "swap_pane_left"
when = "Terminal && split"

[[keybinding]]
key = "alt-shift-k"
command = "swap_pane_down"
when = "Terminal && split"

[[keybinding]]
key = "alt-shift-l"
command = "swap_pane_right"
when = "Terminal && split"