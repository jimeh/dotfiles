#:schema https://github.com/jimeh/huterm/releases/latest/download/huterm.schema.json

[font]
family = "Menlo Nerd Font Mono"
size = 12.0

[theme]
name = "tokyo-night"

[terminal]
macos_option_as_alt = "both"
close_on_exit = true

[window]
macos_fullscreen_mode = "non_native" # non_native or native

[tabs]
always_show = false
auto_hide_in_fullscreen = true

position = "top"        # top, bottom, left, or right
style = "pill"          # pill or strip
pill_accent = false     # accent bar inside the active pill
close_button = "active" # active, hover, or always
notch = "left"          # fullscreen top bar beside a display notch: off, left, or right
width = "fit"           # fit or fill; top and bottom only

[palette]
placement = "center" # top or center

[[keybinding]]
key = "cmd-r"
command = "reload_config"

[[keybinding]]
key = "cmd-{"
command = "previous_tab"

[[keybinding]]
key = "cmd-}"
command = "next_tab"

[[keybinding]]
key = "ctrl-g"
command = "palette_back"

# Toggle the default quake window, even from another application.
[[global_keybinding]]
key = "cmd-ctrl-r"
command = "toggle_quake"
args = { profile = "default" }

[quake.profiles.default]
position = "top"          # top, bottom, left, or right
display = "primary"       # active, pointer, or primary
hide_on_focus_loss = true
width = 1
height = 1
fullscreen = true
animation = "fade"        # auto, none, fade, slide, slide_<dir>, or fade_slide_<dir>
animation_ms = 150
